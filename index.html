<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>DegreePulse | העוזר האישי לתואר ולאימונים</title>
  <!--
    ====================================================================
    מדריך מהיר לעריכת הקוד (עבורך!):
    1. עיצוב וצבעים: נמצאים בתוך תגית <style> תחת :root (משתני CSS).
    2. נתוני ברירת מחדל: נמצאים בתוך <script> בפונקציה getInitialData() - כרגע נקי וריק!
    3. לוגיקה של דפים:
       - renderDashboard() -> הדף הראשי והלו"ז היומי
       - renderSchedule()  -> מערכת שעות וקורסים
       - renderTasks()     -> עבודות, בחנים וקבצי Drive
       - renderExams()     -> לוח מבחנים ומועדים
       - renderTopics()    -> נושאים לחיזוק + חלון למידה (פלאשקארדס, שיעור, צ'אט)
       - renderWorkouts()  -> מעקב אימונים מלא (תרגילים, סטים, משקלים, ריצה)
    ====================================================================
  -->
  <style>
    :root {
      --bg-main: #0b1120;
      --bg-card: rgba(30, 41, 59, 0.78);
      --bg-card-solid: #1e293b;
      --bg-elevated: #334155;
      --bg-glass: rgba(15, 23, 42, 0.85);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(148, 163, 184, 0.16);
      --accent-primary: #6366f1;
      --accent-secondary: #06b6d4;
      --accent-pink: #ec4899;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --gradient-brand: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
      --gradient-cyan: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
      --gradient-emerald: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --shadow-lg: 0 12px 32px -4px rgba(0, 0, 0, 0.45);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    [data-theme="light"] {
      --bg-main: #f1f5f9;
      --bg-card: rgba(255, 255, 255, 0.92);
      --bg-card-solid: #ffffff;
      --bg-elevated: #e2e8f0;
      --bg-glass: rgba(255, 255, 255, 0.9);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: rgba(15, 23, 42, 0.1);
      --shadow-lg: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(at 10% 10%, rgba(99, 102, 241, 0.16) 0px, transparent 50%),
        radial-gradient(at 90% 20%, rgba(6, 182, 212, 0.14) 0px, transparent 50%),
        radial-gradient(at 50% 90%, rgba(236, 72, 153, 0.12) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
      line-height: 1.5;
    }

    .app-shell {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    /* Sidebar Navigation (Desktop) */
    .sidebar {
      width: 270px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      border-left: 1px solid var(--border-color);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 40;
      flex-shrink: 0;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px 24px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--gradient-brand);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: var(--gradient-brand);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.96rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: right;
      font-family: inherit;
    }

    .nav-btn-inner {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-btn:hover {
      background: rgba(99, 102, 241, 0.08);
      color: var(--text-main);
    }

    .nav-btn.active {
      background: var(--gradient-brand);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
    }

    .nav-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.15);
      color: inherit;
      font-weight: 700;
    }

    .sidebar-footer {
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Main Content Area */
    .main-area {
      flex: 1;
      padding: 28px 32px 100px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      min-width: 0;
    }

    /* Top Header */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      padding: 18px 24px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-lg);
    }

    .greeting-box h1 {
      font-size: 1.55rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .greeting-box p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Buttons & Inputs */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.9rem;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--gradient-brand);
      color: #fff;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .btn-secondary {
      background: var(--bg-elevated);
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .btn-secondary:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--accent-primary);
    }

    .btn-emerald {
      background: var(--gradient-emerald);
      color: #fff;
    }

    .btn-danger {
      background: rgba(244, 63, 94, 0.15);
      color: #fb7185;
      border-color: rgba(244, 63, 94, 0.3);
    }

    .btn-danger:hover {
      background: var(--accent-rose);
      color: #fff;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.82rem;
      border-radius: var(--radius-sm);
    }

    /* Quick Add Strip */
    .quick-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 24px;
      scrollbar-width: thin;
    }

    .quick-chip {
      flex-shrink: 0;
      padding: 9px 15px;
      border-radius: 99px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .quick-chip:hover {
      border-color: var(--accent-primary);
      background: rgba(99, 102, 241, 0.14);
      transform: translateY(-1px);
    }

    /* Grid & Cards */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 22px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-lg);
    }

    .stat-value {
      font-size: 1.75rem;
      font-weight: 800;
      line-height: 1.1;
      margin-top: 4px;
    }

    .stat-label {
      font-size: 0.84rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }

    .card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 22px;
      box-shadow: var(--shadow-lg);
      margin-bottom: 22px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Alert Banner */
    .alerts-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .alert-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      background: rgba(15, 23, 42, 0.55);
      border-right: 4px solid var(--accent-amber);
      border: 1px solid var(--border-color);
      border-right-width: 5px;
      flex-wrap: wrap;
    }

    [data-theme="light"] .alert-item {
      background: #f8fafc;
    }

    .alert-urgent {
      border-right-color: var(--accent-rose);
      background: rgba(244, 63, 94, 0.08);
    }

    .alert-soon {
      border-right-color: var(--accent-amber);
      background: rgba(245, 158, 11, 0.08);
    }

    /* Timeline Items */
    .timeline-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .timeline-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid var(--border-color);
      transition: transform 0.15s ease;
      flex-wrap: wrap;
    }

    [data-theme="light"] .timeline-item {
      background: #f8fafc;
    }

    .timeline-item:hover {
      transform: translateX(-3px);
      border-color: rgba(99, 102, 241, 0.4);
    }

    .timeline-time {
      font-weight: 800;
      font-size: 0.92rem;
      color: var(--accent-secondary);
      min-width: 95px;
      padding: 6px 10px;
      background: rgba(6, 182, 212, 0.12);
      border-radius: var(--radius-sm);
      text-align: center;
    }

    /* Badges & Tags */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 0.76rem;
      font-weight: 700;
    }

    .badge-course {
      color: #fff;
      font-weight: 700;
    }

    .badge-urgent {
      background: rgba(244, 63, 94, 0.2);
      color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.35);
    }

    .badge-warning {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }

    .badge-success {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .badge-Workout {
      background: rgba(16, 185, 129, 0.18);
      color: #34d399;
    }

    /* Schedule Table */
    .timetable-wrapper {
      overflow-x: auto;
    }

    .timetable {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
    }

    .timetable th, .timetable td {
      border: 1px solid var(--border-color);
      padding: 12px 10px;
      vertical-align: top;
      width: 16.66%;
    }

    .timetable th {
      background: rgba(99, 102, 241, 0.12);
      font-weight: 700;
      text-align: center;
      font-size: 0.92rem;
    }

    .slot-card {
      padding: 10px;
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      background: rgba(15, 23, 42, 0.65);
      border-right: 4px solid var(--accent-primary);
      font-size: 0.84rem;
      position: relative;
    }

    [data-theme="light"] .slot-card {
      background: #f1f5f9;
    }

    /* Difficult Topics Study Studio */
    .studio-overlay {
      background: var(--bg-card);
      border: 2px solid var(--accent-primary);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .studio-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      overflow-x: auto;
    }

    .studio-tab {
      padding: 10px 18px;
      border-radius: var(--radius-md);
      background: var(--bg-elevated);
      color: var(--text-muted);
      border: 1px solid transparent;
      cursor: pointer;
      font-weight: 700;
      font-family: inherit;
      transition: all 0.2s;
    }

    .studio-tab.active {
      background: var(--gradient-brand);
      color: #fff;
    }

    /* Flashcard 3D */
    .flashcard-stage {
      perspective: 1000px;
      max-width: 540px;
      margin: 16px auto;
    }

    .flashcard-box {
      width: 100%;
      min-height: 230px;
      border-radius: var(--radius-lg);
      background: linear-gradient(145deg, rgba(99, 102, 241, 0.22), rgba(15, 23, 42, 0.9));
      border: 2px solid rgba(99, 102, 241, 0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: var(--shadow-lg);
      user-select: none;
    }

    [data-theme="light"] .flashcard-box {
      background: linear-gradient(145deg, #eef2ff, #ffffff);
    }

    .flashcard-box:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 34px rgba(99, 102, 241, 0.3);
    }

    .flashcard-box.flipped {
      border-color: var(--accent-emerald);
      background: linear-gradient(145deg, rgba(16, 185, 129, 0.2), rgba(15, 23, 42, 0.9));
    }

    [data-theme="light"] .flashcard-box.flipped {
      background: linear-gradient(145deg, #ecfdf5, #ffffff);
    }

    /* Chat Window */
    .chat-box {
      display: flex;
      flex-direction: column;
      height: 400px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: rgba(15, 23, 42, 0.5);
    }

    [data-theme="light"] .chat-box {
      background: #f8fafc;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-bubble {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .chat-bubble.user {
      align-self: flex-start;
      background: var(--gradient-brand);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .chat-bubble.ai {
      align-self: flex-end;
      background: var(--bg-elevated);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--border-color);
      background: var(--bg-card-solid);
    }

    /* Forms & Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.75);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-content {
      background: var(--bg-card-solid);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: rgba(15, 23, 42, 0.55);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.92rem;
    }

    [data-theme="light"] input,
    [data-theme="light"] select,
    [data-theme="light"] textarea {
      background: #f8fafc;
      color: #0f172a;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    /* Progress Bar */
    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(148, 163, 184, 0.2);
      border-radius: 99px;
      overflow: hidden;
      margin: 8px 0;
    }

    .progress-fill {
      height: 100%;
      background: var(--gradient-brand);
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    /* Subtasks & Attachments */
    .subtask-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.35);
      margin-bottom: 6px;
      font-size: 0.86rem;
    }

    [data-theme="light"] .subtask-item {
      background: #f1f5f9;
    }

    .subtask-item.done span {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .file-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 8px;
      background: rgba(6, 182, 212, 0.14);
      border: 1px solid rgba(6, 182, 212, 0.35);
      color: #22d3ee;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      margin-left: 6px;
      margin-top: 6px;
    }

    [data-theme="light"] .file-pill {
      color: #0284c7;
    }

    /* Mobile Bottom Navigation */
    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0;
      right: 0;
      left: 0;
      background: var(--bg-glass);
      backdrop-filter: blur(18px);
      border-top: 1px solid var(--border-color);
      z-index: 60;
      padding: 6px 8px;
      justify-content: space-around;
    }

    .mobile-nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 6px 8px;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
    }

    .mobile-nav-btn.active {
      color: #818cf8;
      background: rgba(99, 102, 241, 0.14);
    }

    .mobile-nav-btn span.icon {
      font-size: 1.2rem;
    }

    /* ---------- רכיבי פריסה משותפים ---------- */
    .item-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .timeline-main {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .timeline-text {
      min-width: 0;
    }

    .date-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .date-row label, .date-row .btn, .nav-badge {
      white-space: nowrap;
      flex-shrink: 0;
    }

    .exercise-add-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr auto;
      gap: 6px;
      margin-bottom: 12px;
    }

    /* טקסט ארוך (קישורים, מילים בלי רווחים) לא ישבור את הפריסה */
    .main-area, .chat-bubble, .modal-content {
      overflow-wrap: anywhere;
    }

    /* מניעת חריגה של גריד בחלונות צרים (לפני נקודת השבירה) */
    .grid-2 { grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr)); }
    .grid-3 { grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); }

    /* ---------- מחשב: מסכים רחבים במיוחד ---------- */
    @media (min-width: 1600px) {
      .main-area { max-width: 1600px; }
    }

    /* ---------- טאבלט / מחשב נייד קטן ---------- */
    @media (max-width: 1100px) and (min-width: 901px) {
      .sidebar { width: 230px; }
      .main-area { padding: 24px 20px 80px; }
    }

    /* ---------- נייד וטאבלט ---------- */
    @media (max-width: 900px) {
      .sidebar {
        display: none;
      }
      .mobile-nav {
        display: flex;
        padding-bottom: calc(6px + env(safe-area-inset-bottom));
      }
      .mobile-nav-btn {
        flex: 1;
        min-width: 0;
        padding: 6px 2px;
      }
      .mobile-nav-btn span:not(.icon) {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
      }
      .main-area {
        padding: 16px 14px calc(96px + env(safe-area-inset-bottom));
      }
      .grid-2, .grid-3 {
        grid-template-columns: 1fr;
      }
      .form-row {
        grid-template-columns: 1fr;
      }
      .stats-row {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .stat-card {
        padding: 14px;
      }
      .stat-value {
        font-size: 1.4rem;
      }
      .stat-icon {
        width: 38px;
        height: 38px;
        font-size: 1.1rem;
      }
      .card {
        padding: 16px;
      }
      .top-bar {
        padding: 14px 16px;
      }
      .greeting-box h1 {
        font-size: 1.2rem;
      }
      .top-actions, .date-row {
        width: 100%;
      }
      .date-row input[type="date"] {
        flex: 1;
        min-width: 0;
      }
      .quick-strip {
        scrollbar-width: none;
        margin-inline: -14px;
        padding-inline: 14px;
      }
      .quick-strip::-webkit-scrollbar {
        display: none;
      }
      .top-actions > .btn {
        width: 100%;
      }

      /* מניעת זום אוטומטי ב-iOS בלחיצה על שדה קלט */
      input, select, textarea {
        font-size: 16px !important;
      }

      /* משטחי מגע נוחים */
      .btn-sm {
        min-height: 36px;
      }

      /* פריטי לו"ז והתראות: כפתורים בשורה נפרדת */
      .timeline-item > .item-actions,
      .alert-item > .btn {
        width: 100%;
        justify-content: flex-end;
      }

      /* מערכת שעות: במקום טבלה רחבה – רשימת ימים */
      .timetable {
        min-width: 0;
      }
      .timetable thead {
        display: none;
      }
      .timetable, .timetable tbody, .timetable tr, .timetable td {
        display: block;
        width: 100%;
      }
      .timetable td {
        border: none;
        border-bottom: 1px solid var(--border-color);
        padding: 12px 0;
      }
      .timetable td::before {
        content: attr(data-day);
        display: block;
        font-weight: 800;
        margin-bottom: 8px;
        color: var(--text-main);
      }

      .exercise-add-row {
        grid-template-columns: 1fr 1fr 1fr;
      }
      .exercise-add-row input:first-child,
      .exercise-add-row .btn {
        grid-column: 1 / -1;
      }

      .chat-box {
        height: 60vh;
        height: 60dvh;
      }
      .chat-bubble {
        max-width: 92%;
      }

      .studio-overlay {
        padding: 16px;
      }
      .studio-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .studio-tab {
        padding: 10px 8px;
        font-size: 0.85rem;
      }
      .flashcard-box {
        min-height: 190px;
        padding: 20px;
      }

      /* חלון קופץ כ"גיליון תחתון" בנייד */
      .modal-backdrop {
        align-items: flex-end;
        padding: 0;
      }
      .modal-content {
        max-width: 100%;
        max-height: 92vh;
        max-height: 92dvh;
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
      }
    }

    /* מסכי טלפון צרים מאוד */
    @media (max-width: 380px) {
      .mobile-nav-btn {
        font-size: 0.62rem;
      }
      .stats-row {
        grid-template-columns: 1fr;
      }
    }

    /* מכשירי מגע: בלי אפקטי ריחוף שנתקעים */
    @media (hover: none) {
      .timeline-item:hover,
      .quick-chip:hover,
      .btn-primary:hover,
      .flashcard-box:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>

        <li>
          <button class="nav-btn" onclick="switchTab('topics')" data-tab="topics">
            <span class="nav-btn-inner"><span>🧠</span> <span>נושאים לחיזוק (חדר למידה)</span></span>

        </li>
        <li>
          <button class="nav-btn" onclick="switchTab('workouts')" data-tab="workouts">

        <li>

    <!-- Main Content -->

            <input type="date" id="selected-date-picker" style="width:auto; padding:7px 10px;" onchange="onDateChange(this.value)" />

      <!-- Quick Action Strip -->

      <button class="mobile-nav-btn active" onclick="switchTab('dashboard')" data-tab="dashboard">
        <span class="icon">🏠</span><span>ראשי</span>
      </button>
      <button class="mobile-nav-btn" onclick="switchTab('schedule')" data-tab="schedule">
        <span class="icon">📅</span><span>מערכת</span>
      </button>
      <button class="mobile-nav-btn" onclick="switchTab('tasks')" data-tab="tasks">
        <span class="icon">📂</span><span>עבודות</span>
      </button>
      <button class="mobile-nav-btn" onclick="switchTab('exams')" data-tab="exams">
        <span class="icon">🎯</span><span>מבחנים</span>
      </button>
      <button class="mobile-nav-btn" onclick="switchTab('topics')" data-tab="topics">
        <span class="icon">🧠</span><span>למידה</span>
      </button>
      <button class="mobile-nav-btn" onclick="switchTab('workouts')" data-tab="workouts">
        <span class="icon">💪</span><span>אימונים</span>
      </button>
      <button class="mobile-nav-btn" onclick="switchTab('cloud')" data-tab="cloud">
        <span class="icon">☁️</span><span>ענן/קוד</span>
      </button>

  </div>

  <!-- Universal Modal -->
  <div class="modal-backdrop" id="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal-content" id="modal-content"></div>
  </div>

  <script>
    // =========================================================================
    // 1. ניהול מצב ונתונים - התחלה נקייה לחלוטין (Clean Slate)
    // =========================================================================
    const STORAGE_KEY = 'degreepulse_clean_v1';
    const DAYS_HEB = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];

    function getTodayISO() {
      const now = new Date();
      const offset = now.getTimezoneOffset() * 60000;
      return new Date(now - offset).toISOString().split('T')[0];
    }

    function addDaysISO(baseIso, days) {
      const d = new Date(baseIso + 'T12:00:00');
      d.setDate(d.getDate() + days);
      return d.toISOString().split('T')[0];
    }

    let currentTab = 'dashboard';
    let selectedDate = getTodayISO();
    let activeStudioTopicId = null;
    let activeStudioTab = 'flashcards';
    let currentCardIndex = 0;
    let isCardFlipped = false;
    let pomodoroInterval = null;
    let pomodoroSeconds = 25 * 60;
    let pomodoroRunning = false;

    function getInitialData() {
      return {
        settings: {
          studentName: '',
          semesterName: 'התואר שלי',
          driveRootUrl: 'https://drive.google.com',
          geminiApiKey: '',
          theme: 'dark'
        },
        courses: [],
        schedule: [],
        tasks: [],
        exams: [],
        topics: [],
        workouts: []
      };
    }

    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          return sanitizeState(JSON.parse(raw));
        }
      } catch (e) {
        console.error('Failed loading state:', e);
      }
      return getInitialData();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        updateNavBadges();
      } catch (e) {
        console.error('Failed saving state:', e);
      }
    }

    // =========================================================================
    // 2. פונקציות עזר כלליות (Helpers)
    // =========================================================================
    function uid(prefix = 'id') {
      return prefix + '_' + Math.random().toString(36).substring(2, 9) + Date.now().toString(36).slice(-3);
    }

    // --- אבטחה: מניעת הזרקת HTML/JS מטקסט שהמשתמש הזין, מגיבוי או מתשובת AI ---
    // כל ערך שמגיע מהנתונים ומוצג בתוך תבנית HTML חייב לעבור דרך esc().
    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // קישורים: רק http(s) או data: (קבצים מקומיים). כל השאר (למשל javascript:) נחסם.
    function safeUrl(url) {
      const u = String(url ?? '').trim();
      return /^(https?:\/\/|data:)/i.test(u) ? esc(u) : '#';
    }

    // מזהים משמשים בתוך onclick, ולכן מותרים בהם רק אותיות, ספרות, _ ו- -
    function safeId(value) {
      return String(value ?? '').replace(/[^\w-]/g, '_');
    }

    function safeColor(value, fallback = '#6366f1') {
      return /^#[0-9a-f]{3,8}$/i.test(String(value ?? '')) ? value : fallback;
    }

    // מנרמל נתונים מ-localStorage או מקובץ גיבוי: ממזג ברירות מחדל, מתקן מזהים וצבעים
    function sanitizeState(raw) {
      const base = getInitialData();
      const src = raw && typeof raw === 'object' ? raw : {};
      const fixList = (list, prefix, nestedKeys = []) =>
        (Array.isArray(list) ? list : [])
          .filter(x => x && typeof x === 'object')
          .map(x => {
            const item = { ...x, id: safeId(x.id) || uid(prefix) };
            if ('courseId' in item) item.courseId = safeId(item.courseId) || 'general';
            nestedKeys.forEach(k => { if (k in item) item[k] = fixList(item[k], k); });
            return item;
          });
      const out = { ...base, ...src, settings: { ...base.settings, ...(src.settings || {}) } };
      out.courses = fixList(src.courses, 'c').map(c => ({ ...c, color: safeColor(c.color) }));
      out.schedule = fixList(src.schedule, 's');
      out.tasks = fixList(src.tasks, 't', ['subtasks', 'files']);
      out.exams = fixList(src.exams, 'e', ['syllabus', 'files']);
      out.topics = fixList(src.topics, 'tp');
      out.workouts = fixList(src.workouts, 'w');
      out.settings.theme = out.settings.theme === 'light' ? 'light' : 'dark';
      return out;
    }

    function getCourse(courseId) {
      return state.courses.find(c => c.id === courseId) || { name: 'כללי', color: '#6366f1', driveUrl: '' };
    }

    function renderCourseOptions(selectedCourseId) {
      const baseOption = `<option value="general" ${!selectedCourseId || selectedCourseId === 'general' ? 'selected' : ''}>כללי / ללא קורס ספציפי</option>`;
      const courseOpts = state.courses.map(c => `<option value="${c.id}" ${c.id === selectedCourseId ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
      return courseOpts ? courseOpts + baseOption : baseOption;
    }

    function daysBetween(dateIso1, dateIso2) {
      const d1 = new Date(dateIso1 + 'T00:00:00');
      const d2 = new Date(dateIso2 + 'T00:00:00');
      return Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
    }

    function formatHebrewDate(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr + 'T12:00:00');
      const dayName = DAYS_HEB[d.getDay()];
      return `יום ${dayName}, ${d.toLocaleDateString('he-IL')}`;
    }

    function getUrgencyBadge(targetIso) {
      const diff = daysBetween(getTodayISO(), targetIso);
      if (diff < 0) return `<span class="badge badge-urgent">באיחור (${Math.abs(diff)} ימים)</span>`;
      if (diff === 0) return `<span class="badge badge-urgent">🔥 היום!</span>`;
      if (diff === 1) return `<span class="badge badge-urgent">⏰ מחר!</span>`;
      if (diff <= 3) return `<span class="badge badge-urgent">בעוד ${diff} ימים</span>`;
      if (diff <= 7) return `<span class="badge badge-warning">בעוד ${diff} ימים</span>`;
      return `<span class="badge badge-success">בעוד ${diff} ימים</span>`;
    }

    function updateNavBadges() {
      const pendingTasks = state.tasks.filter(t => t.status !== 'הוגש').length;
      const upcomingExams = state.exams.filter(e => daysBetween(getTodayISO(), e.date) >= 0).length;
      const activeTopics = state.topics.filter(tp => tp.status !== 'פוצח!').length;

      document.getElementById('badge-schedule').textContent = state.courses.length + ' קורסים';
      document.getElementById('badge-tasks').textContent = pendingTasks;
      document.getElementById('badge-exams').textContent = upcomingExams;
      document.getElementById('badge-topics').textContent = activeTopics;
      document.getElementById('badge-workouts').textContent = state.workouts.length;
    }

    function toggleTheme() {
      state.settings.theme = state.settings.theme === 'light' ? 'dark' : 'light';
      applyTheme();
      saveState();
    }

    function applyTheme() {
      if (state.settings.theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-btn, .mobile-nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function onDateChange(val) {
      if (!val) return;
      selectedDate = val;
      renderHeader();
      if (currentTab === 'dashboard') renderCurrentView();
    }

    function resetToToday() {
      selectedDate = getTodayISO();
      document.getElementById('selected-date-picker').value = selectedDate;
      renderHeader();
      renderCurrentView();
    }

    function renderHeader() {
      const isToday = selectedDate === getTodayISO();
      document.getElementById('selected-date-picker').value = selectedDate;
      document.getElementById('header-greeting').textContent = isToday
        ? `שלום! הנה הלו"ז והיעדים שלך להיום 🚀`
        : `תצוגת לו"ז עבור ${formatHebrewDate(selectedDate)} 📅`;
      document.getElementById('header-date').textContent = `${formatHebrewDate(selectedDate)} • ${state.settings.semesterName}`;
    }

    // =========================================================================
    // 3. רנדור תצוגות האתר (Views)
    // =========================================================================
    function renderCurrentView() {
      renderHeader();
      updateNavBadges();
      const container = document.getElementById('view-container');
      if (currentTab === 'dashboard') container.innerHTML = renderDashboard();
      else if (currentTab === 'schedule') container.innerHTML = renderSchedule();
      else if (currentTab === 'tasks') container.innerHTML = renderTasks();
      else if (currentTab === 'exams') container.innerHTML = renderExams();
      else if (currentTab === 'topics') container.innerHTML = renderTopics();
      else if (currentTab === 'workouts') container.innerHTML = renderWorkouts();
      else if (currentTab === 'cloud') container.innerHTML = renderCloudGuide();
    }

    // -------------------------------------------------------------------------
    // 3.1 דף ראשי ולו"ז יומי (Dashboard)
    // -------------------------------------------------------------------------
    function renderDashboard() {
      const targetDow = new Date(selectedDate + 'T12:00:00').getDay();

      const dayLessons = state.schedule
        .filter(s => Number(s.dayOfWeek) === targetDow)
        .map(s => {
          const c = getCourse(s.courseId);
          return {
            time: s.startTime,
            endTime: s.endTime,
            kind: 'שיעור במערכת',
            icon: '🎓',
            title: `${s.customCourseName || c.name} (${s.type})`,
            subtitle: s.location || 'טרם הוגדר מיקום',
            color: c.color,
            actionHtml: `<button class="btn btn-secondary btn-sm" onclick="switchTab('schedule')">למערכת</button>`
          };
        });

      const dayWorkouts = state.workouts
        .filter(w => w.date === selectedDate)
        .map(w => ({
          time: w.time || '18:00',
          endTime: `${w.durationMin || 60} דק׳`,
          kind: w.completed ? 'אימון בוצע ✅' : 'אימון מתוכנן 💪',
          icon: '🏋️',
          title: w.title,
          subtitle: `${w.category} • ${(w.exercises || []).length} תרגילים מתועדים`,
          color: '#10b981',
          actionHtml: `
            <button class="btn ${w.completed ? 'btn-secondary' : 'btn-emerald'} btn-sm" onclick="toggleWorkoutDone('${w.id}')">
              ${w.completed ? 'בוצע ✓' : 'סמן כבוצע'}
            </button>
            <button class="btn btn-secondary btn-sm" onclick="switchTab('workouts')">פירוט</button>
          `
        }));

      const dayTasks = state.tasks
        .filter(t => t.dueDate === selectedDate)
        .map(t => {
          const c = getCourse(t.courseId);
          return {
            time: t.dueTime || '23:59',
            endTime: t.type,
            kind: `${t.type} להגשה היום!`,
            icon: t.type === 'בוחן' ? '⚡' : '📝',
            title: t.title,
            subtitle: `${c.name} • סטטוס: ${t.status}`,
            color: '#f43f5e',
            actionHtml: `<button class="btn btn-primary btn-sm" onclick="switchTab('tasks')">פתח ${esc(t.type)}</button>`
          };
        });

      const dayExams = state.exams
        .filter(e => e.date === selectedDate)
        .map(e => {
          const c = getCourse(e.courseId);
          return {
            time: e.time || '09:00',
            endTime: e.term,
            kind: 'מבחן היום! 🎯',
            icon: '🚨',
            title: `${e.title} (${c.name})`,
            subtitle: e.location || 'בדוק מיקום כיתה',
            color: '#f43f5e',
            actionHtml: `<button class="btn btn-primary btn-sm" onclick="switchTab('exams')">למבחן</button>`
          };
        });

      const unifiedTimeline = [...dayLessons, ...dayWorkouts, ...dayTasks, ...dayExams]
        .sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));

      const upcomingAlerts = [];
      state.exams.forEach(e => {
        const diff = daysBetween(getTodayISO(), e.date);
        if (diff >= 0 && diff <= 21) {
          const c = getCourse(e.courseId);
          const doneSy = (e.syllabus || []).filter(s => s.done).length;
          const totalSy = (e.syllabus || []).length;
          upcomingAlerts.push({
            diff,
            urgent: diff <= 5,
            type: 'מבחן קרוב 🎯',
            title: `${e.title} - ${c.name}`,
            meta: `${formatHebrewDate(e.date)} בשעה ${e.time} • מוכנות סילבוס: ${doneSy}/${totalSy}`,
            badge: getUrgencyBadge(e.date),
            tab: 'exams'
          });
        }
      });

      state.tasks.filter(t => t.status !== 'הוגש').forEach(t => {
        const diff = daysBetween(getTodayISO(), t.dueDate);
        if (diff <= 10) {
          const c = getCourse(t.courseId);
          const doneSub = (t.subtasks || []).filter(s => s.done).length;
          const totalSub = (t.subtasks || []).length;
          upcomingAlerts.push({
            diff,
            urgent: diff <= 2,
            type: `${t.type} להגשה 📂`,
            title: `${t.title} (${c.name})`,
            meta: `מועד הגשה: ${formatHebrewDate(t.dueDate)} עד ${t.dueTime || '23:59'} • שלבים: ${doneSub}/${totalSub}`,
            badge: getUrgencyBadge(t.dueDate),
            tab: 'tasks'
          });
        }
      });

      upcomingAlerts.sort((a, b) => a.diff - b.diff);

      const openTasksCount = state.tasks.filter(t => t.status !== 'הוגש').length;
      const upcomingExamsCount = state.exams.filter(e => daysBetween(getTodayISO(), e.date) >= 0).length;
      const hardTopicsCount = state.topics.filter(tp => tp.status !== 'פוצח!').length;
      const completedWorkoutsCount = state.workouts.filter(w => w.completed).length;

      return `
        <!-- כרטיסי סטטיסטיקה -->
        <div class="stats-row">
          <div class="stat-card" onclick="switchTab('tasks')" style="cursor:pointer">
            <div>
              <div class="stat-label">עבודות ובחנים פתוחים</div>
              <div class="stat-value">${openTasksCount}</div>
            </div>
            <div class="stat-icon" style="background:rgba(99,102,241,0.18); color:#818cf8;">📂</div>
          </div>
          <div class="stat-card" onclick="switchTab('exams')" style="cursor:pointer">
            <div>
              <div class="stat-label">מבחנים קרובים</div>
              <div class="stat-value">${upcomingExamsCount}</div>
            </div>
            <div class="stat-icon" style="background:rgba(244,63,94,0.18); color:#fb7185;">🎯</div>
          </div>
          <div class="stat-card" onclick="switchTab('topics')" style="cursor:pointer">
            <div>
              <div class="stat-label">נושאים לחיזוק</div>
              <div class="stat-value">${hardTopicsCount}</div>
            </div>
            <div class="stat-icon" style="background:rgba(6,182,212,0.18); color:#22d3ee;">🧠</div>
          </div>
          <div class="stat-card" onclick="switchTab('workouts')" style="cursor:pointer">
            <div>
              <div class="stat-label">אימונים שהושלמו</div>
              <div class="stat-value">${completedWorkoutsCount}/${state.workouts.length}</div>
            </div>
            <div class="stat-icon" style="background:rgba(16,185,129,0.18); color:#34d399;">💪</div>
          </div>
        </div>

        <div class="grid-2">
          <!-- הלו"ז היומי המשולב -->
          <div class="card">
            <div class="card-header">
              <div class="card-title">
                <span>⏱️</span>
                <span>הלו"ז היומי שלי (${selectedDate === getTodayISO() ? 'היום' : formatHebrewDate(selectedDate)})</span>
              </div>
              <div class="item-actions">
                <button class="btn btn-secondary btn-sm" onclick="openScheduleModal()">+ שיעור</button>
                <button class="btn btn-emerald btn-sm" onclick="openWorkoutModal()">+ אימון</button>
              </div>
            </div>

            ${unifiedTimeline.length === 0 ? `
              <div style="text-align:center; padding:32px 16px; color:var(--text-muted);">
                <div style="font-size:2.2rem; margin-bottom:8px;">✨</div>
                <p>הלו"ז היומי שלך מוכן להזנה! הוסף קורסים, שיעורים, אימונים או בחנים כדי לראות אותם כאן.</p>
                <div style="margin-top:14px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
                  <button class="btn btn-primary btn-sm" onclick="openCourseModal()">+ הוסף קורס ראשון</button>
                  <button class="btn btn-secondary btn-sm" onclick="openScheduleModal()">+ הוסף שיעור למערכת</button>
                  <button class="btn btn-emerald btn-sm" onclick="openWorkoutModal()">+ שבץ אימון</button>
                </div>
              </div>
            ` : `
              <div class="timeline-list">
                ${unifiedTimeline.map(item => `
                  <div class="timeline-item" style="border-right: 4px solid ${safeColor(item.color)};">
                    <div class="timeline-main">
                      <div class="timeline-time">
                        <div>${esc(item.time)}</div>
                        <div style="font-size:0.73rem; color:var(--text-muted); font-weight:500;">${esc(item.endTime)}</div>
                      </div>
                      <div class="timeline-text">
                        <div style="font-size:0.76rem; color:var(--text-muted); font-weight:700;">${item.icon} ${esc(item.kind)}</div>
                        <div style="font-weight:700; font-size:1rem; margin:2px 0;">${esc(item.title)}</div>
                        <div style="font-size:0.84rem; color:var(--text-muted);">${esc(item.subtitle)}</div>
                      </div>
                    </div>
                    <div class="item-actions">
                      ${item.actionHtml}
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>

          <!-- מרכז התראות על מבחנים ועבודות קרובים -->
          <div class="card">
            <div class="card-header">
              <div class="card-title">
                <span>🔔</span>
                <span>התראות: מבחנים, בחנים ועבודות קרובות</span>
              </div>
              <div class="item-actions">
                <button class="btn btn-primary btn-sm" onclick="openTaskModal()">+ עבודה/בוחן</button>
                <button class="btn btn-secondary btn-sm" onclick="openExamModal()">+ מבחן</button>
              </div>
            </div>

            ${upcomingAlerts.length === 0 ? `
              <div style="text-align:center; padding:32px 16px; color:var(--text-muted);">
                <div style="font-size:2.2rem; margin-bottom:8px;">🔔</div>
                <p>ברגע שתוסיף עבודות, בחנים או מבחנים קרובים, ההתראות הדחופות יופיעו כאן אוטומטית.</p>
              </div>
            ` : `
              <div class="alerts-container">
                ${upcomingAlerts.map(al => `
                  <div class="alert-item ${al.urgent ? 'alert-urgent' : 'alert-soon'}">
                    <div>
                      <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
                        <span style="font-size:0.78rem; font-weight:700; color:var(--text-muted);">${esc(al.type)}</span>
                        ${al.badge}
                      </div>
                      <div style="font-weight:700; font-size:0.98rem;">${esc(al.title)}</div>
                      <div style="font-size:0.82rem; color:var(--text-muted); margin-top:2px;">${esc(al.meta)}</div>
                    </div>
                    <button class="btn btn-secondary btn-sm" onclick="switchTab('${al.tab}')">טפל בזה ←</button>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        </div>

        <!-- גישה מהירה לנושאים שאני מתקשה בהם -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <span>🧠</span>
              <span>נושאים לחיזוק שמחכים לך בחדר הלמידה</span>
            </div>
            <button class="btn btn-primary btn-sm" onclick="openTopicModal()">+ הוסף נושא שאני מתקשה בו</button>
          </div>
          ${state.topics.length === 0 ? `
            <div style="text-align:center; padding:24px; color:var(--text-muted);">
              <p>עדיין לא הוספת נושאים לחיזוק. לחץ על <strong>"+ הוסף נושא שאני מתקשה בו"</strong> כדי לייצר חדר למידה עם פלאשקארדס, שיעור מובנה וצ'אט.</p>
            </div>
          ` : `
            <div class="grid-3">
              ${state.topics.map(tp => {
                const c = getCourse(tp.courseId);
                return `
                  <div class="timeline-item" style="flex-direction:column; align-items:stretch; border-top:4px solid ${c.color}; cursor:pointer;" onclick="openTopicStudio('${tp.id}')">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                      <span class="badge badge-course" style="background:${c.color}">${esc(c.name)}</span>
                      <span class="badge ${tp.status === 'פוצח!' ? 'badge-success' : 'badge-warning'}">${esc(tp.status)}</span>
                    </div>
                    <div style="font-weight:800; font-size:1.05rem; margin-top:6px;">${esc(tp.title)}</div>
                    <div style="font-size:0.84rem; color:var(--text-muted); flex:1;">${esc(tp.struggleNotes || 'לחץ לפתיחת חדר למידה אינטראקטיבי')}</div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding-top:10px; border-top:1px solid var(--border-color); font-size:0.8rem;">
                      <span>🃏 ${(tp.flashcards || []).length} כרטיסיות • 📖 שיעור • 💬 צ'אט</span>
                      <span style="color:#818cf8; font-weight:700;">כנס לחדר למידה ←</span>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    // -------------------------------------------------------------------------
    // 3.2 מערכת שעות וקורסים (Schedule & Courses)
    // -------------------------------------------------------------------------
    function renderSchedule() {
      return `
        <div class="card">
          <div class="card-header">
            <div class="card-title">🎓 הקורסים שלי הסמסטר (כולל קישור לתיקיית Google Drive לכל קורס)</div>
            <button class="btn btn-primary btn-sm" onclick="openCourseModal()">+ הוסף קורס חדש</button>
          </div>
          ${state.courses.length === 0 ? `
            <div style="text-align:center; padding:28px; color:var(--text-muted);">
              <p>עדיין לא הוספת קורסים. הוסף את הקורסים שלך כדי לשייך אליהם שיעורים, עבודות ומבחנים!</p>
              <button class="btn btn-primary btn-sm" style="margin-top:10px;" onclick="openCourseModal()">+ הוסף קורס ראשון</button>
            </div>
          ` : `
            <div class="grid-3">
              ${state.courses.map(c => `
                <div class="timeline-item" style="border-right: 5px solid ${c.color}; flex-direction:column; align-items:stretch;">
                  <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                    <div>
                      <div style="font-weight:800; font-size:1.05rem;">${esc(c.name)}</div>
                      <div style="font-size:0.84rem; color:var(--text-muted);">מרצה: ${esc(c.lecturer || 'לא הוזן')} • ${esc(c.credits || 0)} נ"ז</div>
                    </div>
                    <div class="item-actions">
                      <button class="btn btn-secondary btn-sm" onclick="openCourseModal('${c.id}')">✏️</button>
                      <button class="btn btn-danger btn-sm" onclick="deleteCourse('${c.id}')">🗑️</button>
                    </div>
                  </div>
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding-top:8px; border-top:1px solid var(--border-color);">
                    ${c.driveUrl ? `<a href="${safeUrl(c.driveUrl)}" target="_blank" rel="noopener" class="file-pill">📁 תיקיית Drive של הקורס ↗</a>` : `<span style="font-size:0.8rem; color:var(--text-muted);">אין קישור ל-Drive</span>`}
                    <button class="btn btn-secondary btn-sm" onclick="openScheduleModal(null, '${c.id}')">+ הוסף שעה</button>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title">📅 מערכת שעות שבועית (ימים א׳ - ו׳)</div>
            <button class="btn btn-primary btn-sm" onclick="openScheduleModal()">+ הוסף שיעור / תרגול למערכת</button>
          </div>
          <div class="timetable-wrapper">
            <table class="timetable">
              <thead>
                <tr>
                  ${[0,1,2,3,4,5].map(d => `<th>יום ${DAYS_HEB[d]}</th>`).join('')}
                </tr>
              </thead>
              <tbody>
                <tr>
                  ${[0,1,2,3,4,5].map(d => {
                    const slots = state.schedule
                      .filter(s => Number(s.dayOfWeek) === d)
                      .sort((a,b) => a.startTime.localeCompare(b.startTime));
                    return `
                      <td data-day="יום ${DAYS_HEB[d]}">
                        ${slots.length === 0 ? `<div style="text-align:center; color:var(--text-muted); font-size:0.8rem; padding:18px 0;">חופשי</div>` : ''}
                        ${slots.map(s => {
                          const c = getCourse(s.courseId);
                          return `
                            <div class="slot-card" style="border-right-color:${c.color}">
                              <div style="font-weight:800; color:${c.color}; font-size:0.78rem;">${esc(s.startTime)} - ${esc(s.endTime)}</div>
                              <div style="font-weight:700; margin:3px 0;">${esc(s.customCourseName || c.name)}</div>
                              <div style="font-size:0.78rem; color:var(--text-muted);">${esc(s.type)} • ${esc(s.location || '')}</div>
                              <div style="display:flex; gap:6px; margin-top:8px;">
                                <button class="btn btn-secondary btn-sm" style="padding:2px 7px; font-size:0.72rem;" onclick="openScheduleModal('${s.id}')">ערוך</button>
                                <button class="btn btn-danger btn-sm" style="padding:2px 7px; font-size:0.72rem;" onclick="deleteScheduleSlot('${s.id}')">מחק</button>
                              </div>
                            </div>
                          `;
                        }).join('')}
                      </td>
                    `;
                  }).join('')}
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // -------------------------------------------------------------------------
    // 3.3 עבודות, בחנים, צ'קליסט ארגון וקבצי Google Drive (Tasks)
    // -------------------------------------------------------------------------
    function renderTasks() {
      const sortedTasks = [...state.tasks].sort((a, b) => a.dueDate.localeCompare(b.dueDate));

      return `
        <div class="card">
          <div class="card-header">
            <div>
              <div class="card-title">📂 ארגון עבודות, בחנים וקבצים מצורפים</div>
              <p style="font-size:0.85rem; color:var(--text-muted); margin-top:4px;">
                כאן תוכל לפרק כל עבודה לתתי-משימות, לעקוב אחרי סטטוס ההגשה ולצרף קישורים לתיקיות/קבצים ב-Google Drive או קבצים מקומיים.
              </p>
            </div>
            <button class="btn btn-primary" onclick="openTaskModal()">➕ הוסף עבודה או בוחן</button>
          </div>

          ${sortedTasks.length === 0 ? `
            <div style="text-align:center; padding:40px;">
              <p style="color:var(--text-muted);">עדיין לא הוזנו עבודות או בחנים.</p>
              <button class="btn btn-primary" style="margin-top:12px;" onclick="openTaskModal()">+ הוסף עבודה או בוחן ראשון</button>
            </div>
          ` : `
            <div class="grid-2">
              ${sortedTasks.map(t => {
                const c = getCourse(t.courseId);
                const subtasks = t.subtasks || [];
                const doneCount = subtasks.filter(s => s.done).length;
                const pct = subtasks.length ? Math.round((doneCount / subtasks.length) * 100) : (t.status === 'הוגש' ? 100 : 0);

                return `
                  <div class="card" style="margin-bottom:0; border-top:4px solid ${c.color}; background:rgba(15,23,42,0.4);">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:10px;">
                      <div>
                        <span class="badge badge-course" style="background:${c.color}">${esc(c.name)}</span>
                        <span class="badge" style="background:rgba(255,255,255,0.1);">${esc(t.type)}</span>
                        ${t.status === 'הוגש' ? `<span class="badge badge-success">✅ הוגש</span>` : getUrgencyBadge(t.dueDate)}
                      </div>
                      <div class="item-actions">
                        <button class="btn btn-secondary btn-sm" onclick="openTaskModal('${t.id}')">✏️ ערוך</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteTask('${t.id}')">🗑️</button>
                      </div>
                    </div>

                    <h3 style="font-size:1.15rem; margin-bottom:4px;">${esc(t.title)}</h3>
                    <div style="font-size:0.84rem; color:var(--text-muted); margin-bottom:10px;">
                      📅 הגשה: ${formatHebrewDate(t.dueDate)} בשעה ${esc(t.dueTime || '23:59')} • עדיפות: ${esc(t.priority)}
                    </div>
                    ${t.notes ? `<div style="font-size:0.86rem; padding:8px 12px; background:rgba(255,255,255,0.04); border-radius:8px; margin-bottom:12px; white-space:pre-wrap;">💡 ${esc(t.notes)}</div>` : ''}

                    <div style="margin-bottom:14px;">
                      <div style="display:flex; justify-content:space-between; font-size:0.82rem; font-weight:700; margin-bottom:4px;">
                        <span>📋 שלבי ביצוע לעבודה (${doneCount}/${subtasks.length})</span>
                        <span>${pct}%</span>
                      </div>
                      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
                      <div style="margin-top:8px;">
                        ${subtasks.map(st => `
                          <div class="subtask-item ${st.done ? 'done' : ''}">
                            <label style="display:flex; align-items:center; gap:8px; margin:0; cursor:pointer; color:var(--text-main); flex:1;">
                              <input type="checkbox" style="width:16px; height:16px;" ${st.done ? 'checked' : ''} onchange="toggleSubtask('${t.id}', '${st.id}')" />
                              <span>${esc(st.text)}</span>
                            </label>
                            <button class="btn btn-danger btn-sm" style="padding:2px 6px; font-size:0.7rem;" onclick="removeSubtask('${t.id}', '${st.id}')">✕</button>
                          </div>
                        `).join('')}
                      </div>
                      <div style="display:flex; gap:6px; margin-top:8px;">
                        <input type="text" id="new-subtask-${t.id}" placeholder="הוסף תת-משימה לארגון העבודה..." style="padding:6px 10px; font-size:0.83rem;" onkeydown="if(event.key==='Enter') addSubtask('${t.id}')" />
                        <button class="btn btn-secondary btn-sm" onclick="addSubtask('${t.id}')">+ שלב</button>
                      </div>
                    </div>

                    <div style="border-top:1px solid var(--border-color); padding-top:12px;">
                      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                        <span style="font-size:0.82rem; font-weight:700;">📎 קבצים מצורפים וקישורי Drive:</span>
                        <button class="btn btn-secondary btn-sm" onclick="openAttachmentModal('task', '${t.id}')">+ צרף קובץ / קישור Drive</button>
                      </div>
                      <div>

              </div>
              <div class="chat-input-row">

          <div style="text-align:center; padding:16px;">

    // -------------------------------------------------------------------------
    // 3.6 מעקב אימונים מלא (Workouts Tracker)
    // -------------------------------------------------------------------------
    function renderWorkouts() {
      const sortedWorkouts = [...state.workouts].sort((a, b) => b.date.localeCompare(a.date));
      const totalWorkouts = state.workouts.length;
      const doneWorkouts = state.workouts.filter(w => w.completed).length;
      const totalMinutes = state.workouts.filter(w => w.completed).reduce((acc, w) => acc + (Number(w.durationMin) || 0), 0);
      const totalPRs = state.workouts.reduce((acc, w) => acc + (w.exercises || []).filter(ex => ex.pr).length, 0);

      return `
        <div class="stats-row">
          <div class="stat-card">
            <div>
              <div class="stat-label">אימונים שבוצעו</div>
              <div class="stat-value">${doneWorkouts} / ${totalWorkouts}</div>
            </div>
            <div class="stat-icon" style="background:rgba(16,185,129,0.18); color:#34d399;">💪</div>
          </div>
          <div class="stat-card">
            <div>
              <div class="stat-label">זמן אימון מצטבר</div>
              <div class="stat-value">${totalMinutes} דק׳</div>
            </div>
            <div class="stat-icon" style="background:rgba(6,182,212,0.18); color:#22d3ee;">⏱️</div>
          </div>
          <div class="stat-card">
            <div>
              <div class="stat-label">שיאים אישיים (PRs)</div>
              <div class="stat-value">${totalPRs} 🏆</div>
            </div>
            <div class="stat-icon" style="background:rgba(245,158,11,0.18); color:#fbbf24;">🔥</div>
          </div>
        </div>

          <div class="card-header">
            <div>

    // =========================================================================
    // 4. פעולות אינטראקטיביות (CRUD, Subtasks, Studio, Workouts)
    // =========================================================================
    function openModal(html) {
      document.getElementById('modal-content').innerHTML = html;
      document.getElementById('modal-backdrop').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.remove('open');
    }

    // --- קורסים ---
    function openCourseModal(courseId = null) {
      const existing = state.courses.find(c => c.id === courseId) || {
        name: '', lecturer: '', credits: 3, color: '#6366f1', driveUrl: ''
      };
      openModal(`
        <h3 style="margin-bottom:16px;">${courseId ? '✏️ עריכת קורס' : '➕ הוספת קורס חדש'}</h3>
        <div class="form-group">
          <label>שם הקורס *</label>
          <input type="text" id="m-course-name" value="${esc(existing.name)}" placeholder="למשל: אלגברה לינארית 1" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>שם המרצה / מתרגל</label>
            <input type="text" id="m-course-lecturer" value="${esc(existing.lecturer || '')}" placeholder="ד״ר..." />
          </div>
          <div class="form-group">
            <label>נקודות זכות (נ"ז)</label>
            <input type="number" step="0.5" id="m-course-credits" value="${esc(existing.credits || 3)}" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>צבע זיהוי במערכת</label>
            <input type="color" id="m-course-color" value="${safeColor(existing.color)}" style="height:42px; padding:4px;" />
          </div>
          <div class="form-group">
            <label>קישור לתיקיית Google Drive של הקורס</label>
            <input type="url" id="m-course-drive" value="${esc(existing.driveUrl || '')}" placeholder="https://drive.google.com/..." />
          </div>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
          <button class="btn btn-secondary" onclick="closeModal()">ביטול</button>
          <button class="btn btn-primary" onclick="saveCourse('${courseId || ''}')">💾 שמור קורס</button>
        </div>
      `);
    }

    function saveCourse(courseId) {
      const name = document.getElementById('m-course-name').value.trim();
      if (!name) return alert('נא להזין את שם הקורס');
      const obj = {
        id: courseId || uid('c'),
        name,
        lecturer: document.getElementById('m-course-lecturer').value.trim(),
        credits: parseFloat(document.getElementById('m-course-credits').value) || 0,
        color: document.getElementById('m-course-color').value,
        driveUrl: document.getElementById('m-course-drive').value.trim()
      };
      if (courseId) {
        state.courses = state.courses.map(c => c.id === courseId ? obj : c);
      } else {
        state.courses.push(obj);
      }
      saveState();
      closeModal();
      renderCurrentView();
    }

    function deleteCourse(courseId) {
      if (!confirm('למחוק את הקורס?')) return;
      state.courses = state.courses.filter(c => c.id !== courseId);
      saveState();
      renderCurrentView();
    }

    // --- מערכת שעות ---
    function openScheduleModal(slotId = null, prefillCourseId = null) {
      const existing = state.schedule.find(s => s.id === slotId) || {
        courseId: prefillCourseId || (state.courses[0]?.id || 'general'),
        customCourseName: '',
        dayOfWeek: new Date(selectedDate + 'T12:00:00').getDay(),
        startTime: '10:00',
        endTime: '12:00',
        type: 'הרצאה',
        location: ''
      };
      openModal(`
        <h3 style="margin-bottom:16px;">${slotId ? '✏️ עריכת משבצת במערכת שעות' : '➕ הוספת שיעור למערכת שעות'}</h3>
        <div class="form-group">
          <label>בחר קורס קיים</label>
          <select id="m-sched-course">
            ${renderCourseOptions(existing.courseId)}
          </select>
        </div>
        <div class="form-group">
          <label>או הקלד שם קורס חדש (ייצור את הקורס אוטומטית אם לא קיים)</label>
          <input type="text" id="m-sched-new-course" value="${esc(existing.customCourseName || '')}" placeholder="למשל: מבוא למדעי המחשב..." />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>יום בשבוע</label>
            <select id="m-sched-day">
              ${[0,1,2,3,4,5].map(d => `<option value="${d}" ${Number(existing.dayOfWeek) === d ? 'selected' : ''}>יום ${DAYS_HEB[d]}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label>סוג שיעור</label>
            <select id="m-sched-type">
              ${['הרצאה', 'תרגול', 'מעבדה', 'סמינר', 'שעת קבלה'].map(tp => `<option value="${tp}" ${existing.type === tp ? 'selected' : ''}>${tp}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>שעת התחלה</label>
            <input type="time" id="m-sched-start" value="${esc(existing.startTime)}" />
          </div>
          <div class="form-group">
            <label>שעת סיום</label>
            <input type="time" id="m-sched-end" value="${esc(existing.endTime)}" />
          </div>
        </div>
        <div class="form-group">
          <label>מיקום (בניין/כיתה או קישור לזום)</label>
          <input type="text" id="m-sched-loc" value="${esc(existing.location || '')}" placeholder="למשל: בניין 34 חדר 102" />
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
          <button class="btn btn-secondary" onclick="closeModal()">ביטול</button>
          <button class="btn btn-primary" onclick="saveScheduleSlot('${slotId || ''}')">💾 שמור במערכת</button>
        </div>
      `);
    }

    function saveScheduleSlot(slotId) {
      let courseId = document.getElementById('m-sched-course').value;
      const newCourseName = document.getElementById('m-sched-new-course').value.trim();

      if (newCourseName) {
        const colors = ['#6366f1', '#06b6d4', '#ec4899', '#10b981', '#f59e0b', '#8b5cf6'];
        const newCourse = {
          id: uid('c'),
          name: newCourseName,
          lecturer: '',
          credits: 3,
          color: colors[state.courses.length % colors.length],
          driveUrl: ''
        };
        state.courses.push(newCourse);
        courseId = newCourse.id;
      }

      const obj = {
        id: slotId || uid('s'),
        courseId,
        dayOfWeek: Number(document.getElementById('m-sched-day').value),
        type: document.getElementById('m-sched-type').value,
        startTime: document.getElementById('m-sched-start').value,
        endTime: document.getElementById('m-sched-end').value,
        location: document.getElementById('m-sched-loc').value.trim()
      };
      if (slotId) {
        state.schedule = state.schedule.map(s => s.id === slotId ? obj : s);
      } else {
        state.schedule.push(obj);
      }
      saveState();
      closeModal();
      renderCurrentView();
    }

    function deleteScheduleSlot(slotId) {
      state.schedule = state.schedule.filter(s => s.id !== slotId);
      saveState();
      renderCurrentView();
    }

    // --- עבודות ובחנים ---
    function openTaskModal(taskId = null) {
      const existing = state.tasks.find(t => t.id === taskId) || {
        title: '',
        courseId: state.courses[0]?.id || 'general',
        type: 'עבודה',
        dueDate: selectedDate,
        dueTime: '23:59',
        priority: 'גבוהה',
        status: 'לביצוע',
        notes: '',
        subtasks: [],
        files: []
      };
      openModal(`
        <h3 style="margin-bottom:16px;">${taskId ? '✏️ עריכת עבודה / בוחן' : '➕ הוספת עבודה או בוחן חדש'}</h3>
        <div class="form-group">
          <label>כותרת העבודה / הבוחן *</label>
          <input type="text" id="m-task-title" value="${esc(existing.title)}" placeholder="למשל: מטלה 1 / בוחן אמצע" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>קורס</label>
            <select id="m-task-course">
              ${renderCourseOptions(existing.courseId)}
            </select>
          </div>
          <div class="form-group">
            <label>סוג</label>
            <select id="m-task-type">
              ${['עבודה', 'בוחן', 'פרויקט', 'דוח מעבדה'].map(tp => `<option value="${tp}" ${existing.type === tp ? 'selected' : ''}>${tp}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>תאריך הגשה / קיום *</label>

          </div>
          <div class="form-group">
            <label>שעת הגשה / התחלה</label>

          <div class="form-group">
            <label>עדיפות</label>
            <select id="m-task-prio">
              ${['גבוהה', 'בינונית', 'נמוכה'].map(p => `<option value="${p}" ${existing.priority === p ? 'selected' : ''}>${p}</option>`).join('')}

            <label>סטטוס</label>
            <select id="m-task-status">
              ${['לביצוע', 'בתהליך', 'הוגש'].map(s => `<option value="${s}" ${existing.status === s ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>הערות והנחיות לעבודה</label>
          <textarea rows="2" id="m-task-notes" placeholder="דגשים להגשה, זוגות, קישורים...">${esc(existing.notes || '')}</textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
          <button class="btn btn-secondary" onclick="closeModal()">ביטול</button>
          <button class="btn btn-primary" onclick="saveTask('${taskId || ''}')">💾 שמור</button>
        </div>
      `);
    }

    function saveTask(taskId) {
      const title = document.getElementById('m-task-title').value.trim();
      if (!title) return alert('נא להזין כותרת');
      const prev = state.tasks.find(t => t.id === taskId);
      const obj = {
        id: taskId || uid('t'),
        title,
        courseId: document.getElementById('m-task-course').value,
        type: document.getElementById('m-task-type').value,
        dueDate: document.getElementById('m-task-date').value,
        dueTime: document.getElementById('m-task-time').value,
        priority: document.getElementById('m-task-prio').value,
        status: document.getElementById('m-task-status').value,
        notes: document.getElementById('m-task-notes').value.trim(),
        subtasks: prev ? prev.subtasks : [],
        files: prev ? prev.files : []
      };
      if (taskId) {
        state.tasks = state.tasks.map(t => t.id === taskId ? obj : t);
      } else {
        state.tasks.push(obj);
      }
      saveState();
      closeModal();
      renderCurrentView();
    }

    function deleteTask(taskId) {
      if (!confirm('למחוק את העבודה/בוחן?')) return;
      state.tasks = state.tasks.filter(t => t.id !== taskId);
      saveState();
      renderCurrentView();
    }

    function toggleTaskCompleted(taskId) {
      const t = state.tasks.find(x => x.id === taskId);
      if (!t) return;
      t.status = t.status === 'הוגש' ? 'בתהליך' : 'הוגש';
      saveState();
      renderCurrentView();
    }

    function addSubtask(taskId) {
      const input = document.getElementById(`new-subtask-${taskId}`);
      if (!input || !input.value.trim()) return;
      const t = state.tasks.find(x => x.id === taskId);
      if (!t) return;
      t.subtasks = t.subtasks || [];
      t.subtasks.push({ id: uid('st'), text: input.value.trim(), done: false });
      saveState();
      renderCurrentView();
    }

    function toggleSubtask(taskId, subtaskId) {
      const t = state.tasks.find(x => x.id === taskId);
      if (!t) return;
      const st = (t.subtasks || []).find(s => s.id === subtaskId);
      if (st) st.done = !st.done;
      saveState();
      renderCurrentView();
    }

    function removeSubtask(taskId, subtaskId) {
      const t = state.tasks.find(x => x.id === taskId);
      if (!t) return;
      t.subtasks = (t.subtasks || []).filter(s => s.id !== subtaskId);
      saveState();
      renderCurrentView();
    }

    // --- צירוף קבצים וקישורי Google Drive ---

      openModal(`

    function saveAttachment(targetType, targetId) {
      const nameInput = document.getElementById('m-att-name').value.trim();
      const urlInput = document.getElementById('m-att-url').value.trim();
      const fileInput = document.getElementById('m-att-file');

      const targetList = targetType === 'task' ? state.tasks : state.exams;
      const item = targetList.find(x => x.id === targetId);
      if (!item) return;
      item.files = item.files || [];

      if (fileInput && fileInput.files && fileInput.files[0]) {
        const file = fileInput.files[0];
        if (file.size > 2.5 * 1024 * 1024) {
          return alert('הקובץ גדול מ-2.5MB. מומלץ להעלות אותו ל-Google Drive ולהדביק כאן את הקישור שלו!');
        }
        const reader = new FileReader();
        reader.onload = function(evt) {
          item.files.push({
            id: uid('f'),
            name: nameInput || file.name,
            fileName: file.name,
            url: evt.target.result,
            type: 'local'
          });
          saveState();
          closeModal();
          renderCurrentView();
        };
        reader.readAsDataURL(file);
      } else {
        if (!urlInput) return alert('נא להדביק קישור מ-Drive או לבחור קובץ');
        item.files.push({
          id: uid('f'),
          name: nameInput || 'קובץ Google Drive',
          url: urlInput,
          type: 'drive'
        });
        saveState();
        closeModal();
        renderCurrentView();
      }
    }

      const targetList = targetType === 'task' ? state.tasks : state.exams;

      if (!item) return;
      item.files = (item.files || []).filter(f => f.id !== fileId);
      saveState();
      renderCurrentView();
    }

          pitfalls: `טעות נפוצה ב"${title}": דילוג על בדיקת תנאי המשפט לפני הפעלתו, או בלבול בסימנים/אינדקסים בשלב המעבר בין השלבים.`,

      saveState();
      closeModal();
