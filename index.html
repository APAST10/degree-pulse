    async function sendStudioChatMessage(topicId) {
      const inp = document.getElementById('studio-chat-input');
      if (!inp || !inp.value.trim()) return;
      const userText = inp.value.trim();
      inp.value = '';

      const tp = state.topics.find(x => x.id === topicId);
      if (!tp) return;
      tp.chatHistory = tp.chatHistory || [];
      tp.chatHistory.push({ role: 'user', text: userText });
      renderCurrentView();

      const c = getCourse(tp.courseId);
      const apiKey = (state.settings.geminiApiKey || '').trim();

      if (apiKey) {
        try {
          const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [{
                  text: `אתה מורה פרטי אקדמי מצוין בעברית. הסטודנט לומד את הקורס "${c.name}" ומתקשה בנושא "${tp.title}". פירוט הקושי שלו: "${tp.struggleNotes}". ענה בצורה ברורה, מעודדת וממוקדת לשאלה הבאה שלו:\n\n${userText}`
                }]
              }]
            })
          });
          const data = await resp.json();
          const aiReply = data?.candidates?.[0]?.content?.parts?.[0]?.text || 'קיבלתי! בוא נפרק את זה שלב אחר שלב.';
          tp.chatHistory.push({ role: 'ai', text: aiReply });
        } catch (err) {
          tp.chatHistory.push({ role: 'ai', text: buildSmartLocalTutorResponse(tp, c, userText) });
        }
      } else {
        tp.chatHistory.push({ role: 'ai', text: buildSmartLocalTutorResponse(tp, c, userText) });
      }

      saveState();
      renderCurrentView();
      const box = document.getElementById('studio-chat-messages');
      if (box) box.scrollTop = box.scrollHeight;
    }

    function buildSmartLocalTutorResponse(tp, course, userText) {
      if (userText.includes('בחן') || userText.includes('שאלה')) {
        return `🎯 שאלת תרגול ברמת מבחן על "${tp.title}" (${course.name}):\n\nנתונה בעיה שבה עליך להחליט האם תנאי "${tp.title}" מתקיימים כאשר אחד הפרמטרים מתאפס.\n1. מהו התנאי הראשון שתבדוק?\n2. איך תמנע את הטעות הנפוצה של "${tp.lesson?.pitfalls || 'דילוג על מקרי קצה'}"?\n\nכתוב לי את כיוון הפתרון שלך ונבדוק אותו יחד!`;
      }
      if (userText.includes('דוגמה') || userText.includes('מאפס')) {
        return `💡 בוא נפרק את "${tp.title}" בצורה הכי אינטואיטיבית שיש:\n\n• הרעיון המרכזי: ${tp.lesson?.intuition || ''}\n• איך ניגשים לתרגיל:\n${(tp.lesson?.steps || []).join('\n')}\n\nרוצה שנעמיק באחד השלבים האלה או שתעתיק פרומפט מלא לשיחה איתי ב-Gemini? (אפשר גם לחבר מפתח Gemini API בהגדרות למעלה לתשובות חיות ישירות כאן!)`;
      }
      return `מעולה ששאלת על "${userText}" בהקשר של ${tp.title}!\n\nכדי לפתור את זה נכון:\n1. חזור להגדרת הבסיס של ${tp.title} ובדוק מה נתון בשאלה.\n2. שים לב במיוחד למוקד הקושי שסימנת: "${tp.struggleNotes || 'דיוק בשלבי המעבר'}".\n3. טיפ: לחץ על "📋 העתק פרומפט מלא ל-Gemini" למעלה אם תרצה שאפתור איתך תרגיל מתמטי או קוד מלא בצ'אט הראשי שלנו, או הזן Gemini API Key בהגדרות האתר!`;
    }

    async function generateAiContentForTopic(topicId) {
      const tp = state.topics.find(x => x.id === topicId);
      if (!tp) return;
      const c = getCourse(tp.courseId);
      const apiKey = (state.settings.geminiApiKey || '').trim();

      if (apiKey) {
        try {
          const prompt = `ייצר בפורמט JSON בלבד ערכת למידה בעברית עבור הנושא "${tp.title}" בקורס "${c.name}". קושי הסטודנט: "${tp.struggleNotes}".
החזר אובייקט JSON במבנה:
{"intuition": "...", "steps": ["1...", "2..."], "pitfalls": "...", "flashcards": [{"q": "...", "a": "..."}, {"q": "...", "a": "..."}, {"q": "...", "a": "..."}]}`;
          const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: 'application/json' }
            })
          });
          const data = await resp.json();
          const rawJson = data?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (rawJson) {
            const parsed = JSON.parse(rawJson);
            tp.lesson.intuition = parsed.intuition || tp.lesson.intuition;
            tp.lesson.steps = parsed.steps || tp.lesson.steps;
            tp.lesson.pitfalls = parsed.pitfalls || tp.lesson.pitfalls;
            if (Array.isArray(parsed.flashcards)) {
              tp.flashcards.push(...parsed.flashcards);
            }
            saveState();
            renderCurrentView();
            return alert('✨ נוצרו כרטיסיות ושיעור חדשים באמצעות Gemini AI!');
          }
        } catch (e) {
          console.error(e);
        }
      }

      tp.flashcards.push(
        { q: `שאלת תרגול (${tp.title}): מהו הצעד הקריטי לפני הפעלת המשפט/אלגוריתם?`, a: `בדיקת תנאי הקדם ומקרי הקצה ווידוא שאין סתירה להנחות היסוד בקורס ${c.name}.` },
        { q: `איך מתמודדים עם הקושי: "${tp.struggleNotes || tp.title}" במבחן?`, a: `מפרקים את השאלה לשלבים מהשיעור המובנה ובודקים דוגמה קטנה לפני הכללה.` }
      );
      saveState();
      renderCurrentView();
      alert('✨ נוספו כרטיסיות תרגול חדשות! (טיפ: לחיבור יצירה חיה מבוססת Gemini AI, ניתן להזין מפתח API חינמי ב"הגדרות AI" בראש הדף).');
    }

    function copyPromptForGemini(topicId) {
      const tp = state.topics.find(x => x.id === topicId);
      if (!tp) return;
      const c = getCourse(tp.courseId);
      const promptText = `היי! אני לומד עכשיו באתר שלי לקורס "${c.name}" ועובד על הנושא שאני מתקשה בו: "${tp.title}".\nמה שמקשה עליי במיוחד: ${tp.struggleNotes || 'הבנה עמוקה ופתרון שאלות מבחן'}.\nבוא נעשה שיעור קצר ואינטראקטיבי: תסביר לי את הנושא בצורה אינטואיטיבית ואז תן לי שאלת תרגול אחת כדי לבדוק שהבנתי.`;
      navigator.clipboard.writeText(promptText).then(() => {
        alert('📋 הפרומפט הועתק ללוח! עכשיו תוכל להדביק אותו ישירות בצ׳אט איתי (Gemini) ונמשיך ללמוד יחד.');
      });
    }

    // --- טיימר פומודורו ---
    function togglePomodoro() {
      if (pomodoroRunning) {
        clearInterval(pomodoroInterval);
        pomodoroRunning = false;
      } else {
        pomodoroRunning = true;
        pomodoroInterval = setInterval(() => {
          if (pomodoroSeconds > 0) {
            pomodoroSeconds--;
            renderCurrentView();
          } else {
            clearInterval(pomodoroInterval);
            pomodoroRunning = false;
            alert('🎉 סיימת 25 דקות למידה ממוקדת! קח 5 דקות הפסקה.');
            pomodoroSeconds = 25 * 60;
            renderCurrentView();
          }
        }, 1000);
      }
      renderCurrentView();
    }

    function resetPomodoro() {
      clearInterval(pomodoroInterval);
      pomodoroRunning = false;
      pomodoroSeconds = 25 * 60;
      renderCurrentView();
    }

    // --- מעקב אימונים מלא ---
    function openWorkoutModal(workoutId = null) {
      const existing = state.workouts.find(w => w.id === workoutId) || {
        title: '',
        category: 'כוח / חדר כושר',
        date: selectedDate,
        time: '18:30',
        durationMin: 60,
        rpe: 8,
        completed: false,
        notes: '',
        exercises: []
      };
      openModal(`
        <h3 style="margin-bottom:16px;">${workoutId ? '✏️ עריכת אימון' : '💪 שיבוץ / תיעוד אימון חדש'}</h3>
        <div class="form-group">
          <label>שם האימון *</label>
          <input type="text" id="m-wk-title" value="${esc(existing.title)}" placeholder="למשל: אימון כוח A / ריצת 5 ק״מ" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>קטגוריית אימון</label>
            <select id="m-wk-cat">
              ${['כוח / חדר כושר', 'ריצה / אירובי', 'משקל גוף / קליסטניקס', 'שחייה / אופניים', 'גמישות / מתיחות'].map(cat => `<option value="${cat}" ${existing.category === cat ? 'selected' : ''}>${cat}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label>סטטוס</label>
            <select id="m-wk-done">
              <option value="false" ${!existing.completed ? 'selected' : ''}>מתוכנן בלו"ז היומי</option>
              <option value="true" ${existing.completed ? 'selected' : ''}>בוצע ✅</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>תאריך האימון *</label>
            <input type="date" id="m-wk-date" value="${esc(existing.date)}" />
          </div>
          <div class="form-group">
            <label>שעה בלו"ז היומי</label>
            <input type="time" id="m-wk-time" value="${esc(existing.time || '18:30')}" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>משך האימון (דקות)</label>
            <input type="number" id="m-wk-dur" value="${esc(existing.durationMin || 60)}" />
          </div>
          <div class="form-group">
            <label>דרגת מאמץ (RPE 1-10)</label>
            <input type="number" min="1" max="10" id="m-wk-rpe" value="${esc(existing.rpe || 8)}" />
          </div>
        </div>
        <div class="form-group">
          <label>מטרות / הערות לאימון</label>
          <textarea rows="2" id="m-wk-notes" placeholder="דגשים, זמני מנוחה, קצב יעד...">${esc(existing.notes || '')}</textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
          <button class="btn btn-secondary" onclick="closeModal()">ביטול</button>
          <button class="btn btn-primary" onclick="saveWorkout('${workoutId || ''}')">💾 שמור אימון</button>
        </div>
      `);
    }

    function saveWorkout(workoutId) {
      const title = document.getElementById('m-wk-title').value.trim();
      if (!title) return alert('נא להזין את שם האימון');
      const prev = state.workouts.find(w => w.id === workoutId);
      const obj = {
        id: workoutId || uid('w'),
        title,
        category: document.getElementById('m-wk-cat').value,
        completed: document.getElementById('m-wk-done').value === 'true',
        date: document.getElementById('m-wk-date').value,
        time: document.getElementById('m-wk-time').value,
        durationMin: Number(document.getElementById('m-wk-dur').value) || 60,
        rpe: Number(document.getElementById('m-wk-rpe').value) || 7,
        notes: document.getElementById('m-wk-notes').value.trim(),
        exercises: prev ? prev.exercises : []
      };
      if (workoutId) {
        state.workouts = state.workouts.map(w => w.id === workoutId ? obj : w);
      } else {
        state.workouts.unshift(obj);
      }
      saveState();
      closeModal();
      renderCurrentView();
    }

    function toggleWorkoutDone(workoutId) {
      const w = state.workouts.find(x => x.id === workoutId);
      if (!w) return;
      w.completed = !w.completed;
      saveState();
      renderCurrentView();
    }

    function deleteWorkout(workoutId) {
      if (!confirm('למחוק את האימון?')) return;
      state.workouts = state.workouts.filter(w => w.id !== workoutId);
      saveState();
      renderCurrentView();
    }

    function quickAddExercise(workoutId) {
      const name = document.getElementById(`ex-name-${workoutId}`)?.value.trim();
      if (!name) return alert('נא להזין שם תרגיל');
      const sets = document.getElementById(`ex-sets-${workoutId}`)?.value || 3;
      const reps = document.getElementById(`ex-reps-${workoutId}`)?.value || '10';
      const weightRaw = document.getElementById(`ex-weight-${workoutId}`)?.value.trim() || '';

      const w = state.workouts.find(x => x.id === workoutId);
      if (!w) return;
      w.exercises = w.exercises || [];

      const isRun = w.category.includes('ריצה') || weightRaw.includes('ק"מ');
      w.exercises.push({
        name,
        sets: Number(sets) || 1,
        reps,
        weightKg: isRun ? 0 : (parseFloat(weightRaw) || 0),
        distanceKm: isRun ? weightRaw.replace('ק"מ', '').trim() : '',
        pr: false
      });

      saveState();
      renderCurrentView();
    }

    function removeExerciseFromWorkout(workoutId, idx) {
      const w = state.workouts.find(x => x.id === workoutId);
      if (!w) return;
      w.exercises.splice(idx, 1);
      saveState();
      renderCurrentView();
    }

    // --- הגדרות כלליות, AI וגיבוי ---
    function openAiSettingsModal() {
      openModal(`
        <h3 style="margin-bottom:14px;">✨ הגדרות סמסטר, Google Drive וחיבור Gemini AI</h3>
        <div class="form-group">
          <label>שם הסמסטר / התואר</label>
          <input type="text" id="m-set-sem" value="${esc(state.settings.semesterName || '')}" />
        </div>
        <div class="form-group">
          <label>קישור לתיקיית Google Drive הראשית של התואר</label>
          <input type="url" id="m-set-drive" value="${esc(state.settings.driveRootUrl || '')}" placeholder="https://drive.google.com/..." />
        </div>
        <div class="form-group">
          <label>מפתח Gemini API (אופציונלי - לחיבור חי של צ'אט הלמידה ומחולל הפלאשקארדס)</label>
          <input type="password" id="m-set-key" value="${esc(state.settings.geminiApiKey || '')}" placeholder="AIzaSy..." />
          <small style="color:var(--text-muted); display:block; margin-top:4px;">
            ניתן להפיק מפתח חינמי ב-Google AI Studio (aistudio.google.com). המפתח נשמר מקומית בדפדפן שלך בלבד. גם ללא מפתח, חדר הלמידה מייצר כרטיסיות ותבניות שיעור אוטומטית!
          </small>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
          <button class="btn btn-secondary" onclick="closeModal()">ביטול</button>
          <button class="btn btn-primary" onclick="saveAiSettings()">💾 שמור הגדרות</button>
        </div>
      `);
    }

    function saveAiSettings() {
      state.settings.semesterName = document.getElementById('m-set-sem').value.trim() || 'התואר שלי';
      state.settings.driveRootUrl = document.getElementById('m-set-drive').value.trim();
      state.settings.geminiApiKey = document.getElementById('m-set-key').value.trim();
      saveState();
      closeModal();
      renderCurrentView();
    }

    function exportBackup() {
      const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(state, null, 2));
      const a = document.createElement('a');
      a.setAttribute('href', dataStr);
      a.setAttribute('download', `degreepulse_backup_${getTodayISO()}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function importBackup(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const imported = JSON.parse(evt.target.result);
          if (imported && Array.isArray(imported.courses)) {
            state = sanitizeState(imported);
            saveState();
            applyTheme();
            renderCurrentView();
            alert('✅ הנתונים שוחזרו בהצלחה!');
          }
        } catch (err) {
          alert('שגיאה בקריאת קובץ הגיבוי.');
        }
      };
      reader.readAsText(file);
    }

    function resetAllData() {
      if (!confirm('האם לנקות את כל הנתונים ולהתחיל מדף חלק?')) return;
      localStorage.removeItem(STORAGE_KEY);
      state = getInitialData();
      saveState();
      renderCurrentView();
    }

    // אתחול האפליקציה
    applyTheme();
    renderCurrentView();
  </script>
</body>
</html>
